<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your QR Code</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <div class="card result-card">

        <h1>Your QR Code</h1>

        <p class="employee">
            Employee ID: <strong>{{ emp_id }}</strong>
        </p>

        <div class="qr-container">

            <img
                src="{{ url_for('qr_image', filename=filename) }}"
                alt="QR Code"
                class="qr-image"
            >

        </div>

        <a
            href="{{ url_for('download', filename=filename) }}"
            class="download-button"
        >
            Download QR Code
        </a>

        <a href="/" class="back-button">
            Search Another Employee
        </a>

    </div>

</div>

</body>
</html>
